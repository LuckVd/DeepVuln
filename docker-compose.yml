# DeepVuln Docker Compose 配置
#
# 使用方法:
#   # 使用环境变量
#   export OPENAI_API_KEY=your-key
#   docker-compose run --rm deepvuln scan -p /target
#

# ⚠️ 已废弃（audit B2，2026-08-25）：CLI（src.cli.main）已随 web-only 迁移移除，
# 本文件围绕 `deepvuln scan ...` CLI 用法编写，已不可用。Web 部署请使用
# docker-compose-web.yml（容器栈）或 docker-compose-web-host.yml（主机数据库）。
# 保留本文件仅作历史参考/构建参数参考。
version: "3.8"

services:
  deepvuln:
    build:
      context: .
      dockerfile: Dockerfile
      extra_hosts:
        - "host.docker.internal:host-gateway"
      args:
        APT_MIRROR: ${APT_MIRROR:-https://mirrors.tuna.tsinghua.edu.cn/debian}
        HTTP_PROXY: ${BUILD_HTTP_PROXY:-}
        HTTPS_PROXY: ${BUILD_HTTPS_PROXY:-}
        NO_PROXY: ${BUILD_NO_PROXY:-}
        GO_DOWNLOAD_URL: ${GO_DOWNLOAD_URL:-https://go.dev/dl/go1.22.0.linux-amd64.tar.gz}
        GO_DOWNLOAD_FALLBACK_URL: ${GO_DOWNLOAD_FALLBACK_URL:-https://dl.google.com/go/go1.22.0.linux-amd64.tar.gz}
        CODEQL_DOWNLOAD_URL: ${CODEQL_DOWNLOAD_URL:-}
        CODEQL_DOWNLOAD_FALLBACK_URL: ${CODEQL_DOWNLOAD_FALLBACK_URL:-https://ghproxy.net/https://github.com/github/codeql-cli-binaries/releases/download/v2.24.2/codeql-linux64.zip}
        PRELOAD_CODEQL_PACKS: ${PRELOAD_CODEQL_PACKS:-true}
    image: deepvuln:latest
    container_name: deepvuln

    # 资源限制
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 8G
        reservations:
          cpus: "0.5"
          memory: 2G

    # 环境变量
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.lkeap.cloud.tencent.com/coding/v3}
      - PYTHONUNBUFFERED=1
      - HOME=/home/deepvuln
      # 不设置 HTTP_PROXY/HTTPS_PROXY，让容器内工具不使用代理
      - NO_PROXY=localhost,127.0.0.1,::1

    # 卷挂载
    volumes:
      # 待扫描代码
      - ${TARGET_PATH:-./target}:/target  # 读写挂载以支持 CodeQL 构建
      # 配置文件（可选）
      # 缓存目录（加速重复扫描）
      - deepvuln-cache:/home/deepvuln/.cache
      # CodeQL 数据库缓存
      - codeql-databases:/tmp/codeql_cache
      # CodeQL 查询包缓存
      - codeql-packs:/home/deepvuln/.codeql

    # 工作目录
    working_dir: /target

    # 默认命令
    command: ["--help"]

    # 安全配置
    security_opt:
      - no-new-privileges:true
    read_only: false
    cap_drop:
      - ALL
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # 可选：用于大型项目的扫描服务
  deepvuln-worker:
    build:
      context: .
      dockerfile: Dockerfile
      extra_hosts:
        - "host.docker.internal:host-gateway"
      args:
        APT_MIRROR: ${APT_MIRROR:-https://mirrors.tuna.tsinghua.edu.cn/debian}
        HTTP_PROXY: ${BUILD_HTTP_PROXY:-}
        HTTPS_PROXY: ${BUILD_HTTPS_PROXY:-}
        NO_PROXY: ${BUILD_NO_PROXY:-}
        GO_DOWNLOAD_URL: ${GO_DOWNLOAD_URL:-https://go.dev/dl/go1.22.0.linux-amd64.tar.gz}
        GO_DOWNLOAD_FALLBACK_URL: ${GO_DOWNLOAD_FALLBACK_URL:-}
        CODEQL_DOWNLOAD_URL: ${CODEQL_DOWNLOAD_URL:-}
        CODEQL_DOWNLOAD_FALLBACK_URL: ${CODEQL_DOWNLOAD_FALLBACK_URL:-}
        PRELOAD_CODEQL_PACKS: ${PRELOAD_CODEQL_PACKS:-true}
    image: deepvuln:latest
    container_name: deepvuln-worker

    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 4G

    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      - WORKER_MODE=true
      - HOME=/home/deepvuln
      - HTTP_PROXY=${HTTP_PROXY:-}
      - HTTPS_PROXY=${HTTPS_PROXY:-}
      - NO_PROXY=${NO_PROXY:-}

    volumes:
      - deepvuln-cache:/home/deepvuln/.cache
      - codeql-databases:/tmp/codeql_cache
      - codeql-packs:/home/deepvuln/.codeql

    command: ["--version"]
    profiles:
      - worker
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  deepvuln-cache:
    name: deepvuln-cache
  codeql-databases:
    name: codeql-databases
  codeql-packs:
    name: codeql-packs

# 网络配置
networks:
  default:
    name: deepvuln-network
