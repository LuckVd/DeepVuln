id: weak_crypto_md5
severity: medium
title: Weak Cryptography (MD5)
description: MD5 is a weak hash function vulnerable to collision attacks. Use SHA-256 or stronger instead.
cwe: CWE-327
category: weak_crypto
languages:
  - python
queries:
  python: |
    ((call
      (attribute
        object: (identifier) @obj
        attribute: (identifier) @attr))
     (#eq? @obj "hashlib")
     (#match? @attr "md5"))
