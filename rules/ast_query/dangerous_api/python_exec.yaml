id: dangerous_exec
severity: critical
title: Dangerous exec() Usage
description: exec() executes arbitrary Python code. If the input contains malicious code, this leads to Remote Code Execution.
cwe: CWE-94
category: code_injection
languages:
  - python
queries:
  python: |
    ((call
      (identifier) @func)
     (#match? @func "^exec$"))
