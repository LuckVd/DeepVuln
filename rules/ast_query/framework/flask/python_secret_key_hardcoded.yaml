id: flask_secret_key_hardcoded
severity: medium
title: Flask hardcoded secret key
description: Hardcoded secret key in production can be exploited for session forgery, token signing, and cryptographic operations.
cwe: CWE-798
category: hardcoded_secrets
languages:
  - python
queries:
  python: |
    ((assignment) @assign
     (#match? @assign "SECRET_KEY"))
