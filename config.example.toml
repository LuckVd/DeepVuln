# DeepVuln 内部配置文件
# 此文件仅包含内部/调试配置，不需要用户修改
#
# 用户配置请通过以下方式设置：
# - Web UI: 在设置页面配置 LLM、扫描参数、API 密钥等
# - 环境变量: 用于 CLI 模式（见下方说明）

# =============================================================================
# 内部配置（通常不需要修改）
# =============================================================================

[database]
# 威胁情报数据库路径（本地 SQLite）
# 用于缓存 CVE 数据和 GitHub Advisory 数据
path = "./data/threat_intel.db"

# 自动同步间隔（天）
# 超过此天数未同步，CLI 会提示更新
auto_sync_days = 7

[logging]
# 日志级别
# 可选值: DEBUG, INFO, WARNING, ERROR
level = "INFO"

# 日志文件路径
file = "./logs/deepvuln.log"

# =============================================================================
# 目录分类配置（内部逻辑配置）
# =============================================================================

[directory_classification]
# 是否启用目录分类降权
# 启用后，非生产代码（测试、示例、challenge等）的漏洞评分会被降低
enabled = true

# 自定义目录分类
[directory_classification.custom_dirs]
challenge_code = ["juice-shop", "dvwa", "webgoat", "my-vuln-app"]
sample_code = ["examples", "demos", "poc"]
test_code = ["__tests__", "specs"]
fixture_code = ["test-fixtures", "mock-data"]

# 自定义降权因子
[directory_classification.multipliers]
production_code = 1.0
test_code = 0.3
sample_code = 0.1
fixture_code = 0.2
challenge_code = 0.1

# =============================================================================
# 用户配置说明
# =============================================================================
#
# 以下配置项需要用户设置，请通过 Web UI 设置页面或环境变量配置：
#
# === LLM 配置 ===
# Web UI: 设置 → LLM 配置
# CLI 环境变量:
#   OPENAI_API_KEY / LLM_API_KEY      # API 密钥
#   OPENAI_BASE_URL / LLM_BASE_URL    # API 地址
#   LLM_MODEL                          # 模型名称
#   LLM_TIMEOUT                        # 超时时间（秒）
#   LLM_MAX_RETRIES                    # 最大重试次数
#   LLM_MAX_CONCURRENT_REQUESTS        # 最大并发数
#
# === 扫描配置 ===
# Web UI: 设置 → 扫描配置
# CLI 环境变量:
#   SCAN_TIMEOUT                      # 扫描超时（秒）
#   SCAN_MAX_CONCURRENT_FILES          # 最大并发文件数
#
# === 威胁情报配置 ===
# Web UI: 设置 → API 密钥配置
# CLI 环境变量:
#   GITHUB_TOKEN                       # GitHub Token
#   NVD_API_KEY                        # NVD API Key
#
# =============================================================================
