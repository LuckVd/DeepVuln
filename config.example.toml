# DeepVuln 配置示例
# 复制此文件为 config.local.toml 并填入实际值
#
# 复制命令:
#   cp config.example.toml config.local.toml

[threat_intel]
# GitHub Personal Access Token
# 用于访问 GitHub Advisory Database API，提高请求限制
#
# 获取步骤:
#   1. 登录 GitHub
#   2. 进入 Settings → Developer settings → Personal access tokens → Tokens (classic)
#   3. 点击 "Generate new token (classic)"
#   4. 勾选权限: public_repo
#   5. 生成并复制 Token
#
# 获取地址: https://github.com/settings/tokens
github_token = "YOUR_GITHUB_TOKEN_HERE"

# NVD API Key (可选)
# 用于提高 NVD API 请求速率限制
#
# 获取地址: https://nvd.nist.gov/developers/request-an-api-key
nvd_api_key = ""

[scan]
# 扫描超时时间（秒）
# 默认: 300
timeout = 300

# 最大并发扫描数
# 默认: 10
max_concurrent = 10

[database]
# 数据库路径
# 存储 CVE 和威胁情报数据
# 默认: "./data/threat_intel.db"
path = "./data/threat_intel.db"

# 自动同步间隔（天）
# 超过此天数未同步，CLI 会提示更新
# 默认: 7
auto_sync_days = 7

[logging]
# 日志级别
# 可选值: DEBUG, INFO, WARNING, ERROR
# 默认: INFO
level = "INFO"

# 日志文件路径
# 默认: "./logs/deepvuln.log"
file = "./logs/deepvuln.log"

# =============================================================================
# LLM 配置
# =============================================================================

[llm]
# 默认 LLM 提供商
# 可选值: openai, azure, ollama, custom
# 默认: openai
provider = "openai"

# 默认模型
# OpenAI: gpt-4, gpt-4-turbo, gpt-3.5-turbo
# Ollama: llama2, mistral, codellama 等
# 默认: gpt-4
model = "gpt-4"

# 请求超时（秒）
# 默认: 120
timeout = 120

# 最大重试次数
# 默认: 3
max_retries = 3

# 最大输出 token 数
# 默认: 4096
max_tokens = 4096

# 温度参数 (0.0-2.0)
# 较低的值使输出更确定，较高的值使输出更随机
# 默认: 0.1
temperature = 0.1

# 批量分析配置
# 每批分析的最大字符数，用于入口点检测
# 使用字符限制而非文件数量，可以防止 LLM 响应被截断
# 注意：确保每批包含完整的文件（不会在文件中间截断）
# 建议：30000-60000 字符/批次
# 默认: 50000
batch_max_chars = 50000

# (已弃用) 每批分析的文件数量
# 现在使用 batch_max_chars 进行字符级别的批次控制
# 保留此选项用于向后兼容
# 默认: 20
batch_size = 20

# -----------------------------------------------------------------------------
# OpenAI 配置
# -----------------------------------------------------------------------------
[llm.openai]
# API Key (也可通过环境变量 OPENAI_API_KEY 设置)
# 获取地址: https://platform.openai.com/api-keys
api_key = ""

# API Base URL (用于兼容 API)
# 默认: https://api.openai.com/v1
base_url = "https://api.openai.com/v1"

# Organization ID (可选)
organization = ""

# -----------------------------------------------------------------------------
# Azure OpenAI 配置
# -----------------------------------------------------------------------------
[llm.azure]
# API Key (也可通过环境变量 AZURE_OPENAI_API_KEY 设置)
api_key = ""

# Azure Endpoint (也可通过环境变量 AZURE_OPENAI_ENDPOINT 设置)
# 示例: https://your-resource.openai.azure.com
endpoint = ""

# Deployment 名称
deployment = ""

# API 版本
# 默认: 2024-02-15-preview
api_version = "2024-02-15-preview"

# -----------------------------------------------------------------------------
# Ollama 配置 (本地模型)
# -----------------------------------------------------------------------------
[llm.ollama]
# Ollama 服务地址 (也可通过环境变量 OLLAMA_BASE_URL 设置)
# 默认: http://localhost:11434
base_url = "http://localhost:11434"

# 默认模型
# 常用: llama2, mistral, codellama, deepseek-coder
model = "llama2"

# =============================================================================
# P6-07: 目录分类配置
# =============================================================================

[directory_classification]
# 是否启用目录分类降权
# 启用后，非生产代码（测试、示例、challenge等）的漏洞评分会被降低
# 关闭后，所有文件都视为 production_code (multiplier = 1.0)
enabled = true

# 自定义目录分类（扩展默认规则）
# 格式: 目录列表，匹配到的目录将使用对应分类
[directory_classification.custom_dirs]
# 将特定目录标记为 challenge（故意存在漏洞的代码）
challenge_code = ["juice-shop", "dvwa", "webgoat", "my-vuln-app"]
# 将特定目录标记为 sample（示例/演示代码）
sample_code = ["examples", "demos", "poc"]
# 将特定目录标记为 test（测试代码）
test_code = ["__tests__", "specs"]
# 将特定目录标记为 fixture（测试夹具数据）
fixture_code = ["test-fixtures", "mock-data"]

# 自定义降权因子（覆盖默认值）
# 范围: 0.0 - 1.0，值越小降权越多
# production_code 默认 1.0（不降权）
[directory_classification.multipliers]
production_code = 1.0
test_code = 0.3
sample_code = 0.1
fixture_code = 0.2
challenge_code = 0.1
