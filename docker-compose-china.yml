# DeepVuln Docker Compose 配置 - 国内网络优化版
#
# 使用方法:
#   # 1. 配置构建环境变量
#   cp .env.docker.build .env.docker.build.local
#   # 编辑 .env.docker.build.local，如需要代理则设置 BUILD_HTTP_PROXY
#
#   # 2. 构建镜像
#   docker-compose -f docker-compose-china.yml build
#
#   # 3. 运行扫描
#   export OPENAI_API_KEY=your-key
#   export TARGET_PATH=/opt/projects/benchmark/Qbenchmark/env_validation/java-simple-vuln
#   docker-compose -f docker-compose-china.yml run --rm deepvuln scan -p /target --base
#
#   # 或者使用本地目录挂载
#   docker-compose -f docker-compose-china.yml run --rm \
#     -v /opt/projects/benchmark/Qbenchmark/env_validation/java-simple-vuln:/target:ro \
#     deepvuln scan -p /target --base

# ⚠️ 已废弃（audit B2，2026-08-25）：CLI（src.cli.main）已随 web-only 迁移移除，
# 本文件围绕 `deepvuln scan ...` CLI 用法编写，已不可用。Web 部署请使用
# docker-compose-web.yml（容器栈）或 docker-compose-web-host.yml（主机数据库）。
# 保留本文件仅作历史参考/构建参数参考。
version: "3.8"

services:
  deepvuln:
    build:
      context: .
      dockerfile: Dockerfile
      extra_hosts:
        - "host.docker.internal:host-gateway"
      args:
        # 使用国内 APT 镜像
        APT_MIRROR: ${APT_MIRROR:-https://mirrors.tuna.tsinghua.edu.cn/debian}
        # 构建时代理（从 .env.docker.build.local 读取）
        HTTP_PROXY: ${BUILD_HTTP_PROXY:-}
        HTTPS_PROXY: ${BUILD_HTTPS_PROXY:-}
        NO_PROXY: ${BUILD_NO_PROXY:-localhost,127.0.0.1,::1,10.*,192.168.*,172.16.*,mirrors.tuna.tsinghua.edu.cn,pypi.tuna.tsinghua.edu.cn,ghproxy.net,goproxy.cn}
        # Go 下载配置
        GO_DOWNLOAD_URL: ${GO_DOWNLOAD_URL:-https://go.dev/dl/go1.22.0.linux-amd64.tar.gz}
        GO_DOWNLOAD_FALLBACK_URL: ${GO_DOWNLOAD_FALLBACK_URL:-https://goproxy.cn/dl/go1.22.0.linux-amd64.tar.gz}
        # CodeQL 下载配置
        CODEQL_DOWNLOAD_URL: ${CODEQL_DOWNLOAD_URL:-}
        CODEQL_DOWNLOAD_FALLBACK_URL: ${CODEQL_DOWNLOAD_FALLBACK_URL:-https://ghproxy.net/https://github.com/github/codeql-cli-binaries/releases/download/v2.25.1/codeql-linux64.zip}
        # 跳过 CodeQL Pack 预加载（运行时再下载）
        PRELOAD_CODEQL_PACKS: ${PRELOAD_CODEQL_PACKS:-false}
    image: deepvuln:latest
    container_name: deepvuln

    # 资源限制
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 8G
        reservations:
          cpus: "1"
          memory: 2G

    # 环境变量
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      - PYTHONUNBUFFERED=1
      - HOME=/home/deepvuln
      # 运行时可能需要的代理（用于扫描时下载依赖）
      - HTTP_PROXY=${RUNTIME_HTTP_PROXY:-}
      - HTTPS_PROXY=${RUNTIME_HTTPS_PROXY:-}
      - NO_PROXY=${RUNTIME_NO_PROXY:-localhost,127.0.0.1,::1,10.*,192.168.*,172.16.*}
      # Maven 配置
      - MAVEN_OPTS=-Dmaven.repo.local=/home/deepvuln/.m2/repository

    # 卷挂载
    volumes:
      # 待扫描代码（默认值，可通过环境变量覆盖）
      - ${TARGET_PATH:-./target}:/target:ro
      # Maven 配置（阿里云镜像）
      - ./docker-config/maven/settings.xml:/home/deepvuln/.m2/settings.xml:ro
      # 缓存目录
      - deepvuln-cache:/home/deepvuln/.cache
      - maven-repo:/home/deepvuln/.m2/repository
      # CodeQL 缓存
      - codeql-databases:/tmp/codeql_cache
      - codeql-packs:/home/deepvuln/.codeql

    # 工作目录
    working_dir: /target

    # 默认命令
    command: ["--help"]

    # 安全配置
    security_opt:
      - no-new-privileges:true
    read_only: false
    cap_drop:
      - ALL
    extra_hosts:
      - "host.docker.internal:host-gateway"

    # 网络模式（如果需要访问宿主机代理，使用 host 网络）
    # network_mode: host

volumes:
  deepvuln-cache:
    name: deepvuln-cache
  maven-repo:
    name: maven-repo
  codeql-databases:
    name: codeql-databases
  codeql-packs:
    name: codeql-packs

networks:
  default:
    name: deepvuln-network
