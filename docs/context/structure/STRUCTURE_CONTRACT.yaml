contract:
  version: 1
  top_level_paths:
    - .claude/
    - docs/
    - README.md
    - src/
    - tools/
  modules:
    - name: governance-core
      paths:
        - .claude/**
        - tools/**
      role: workflows_and_policies
      sync_docs:
        - docs/context/structure/README.md
    - name: planning-state
      paths:
        - docs/goals/**
        - docs/roadmap/**
        - docs/history/**
      role: project_state
      sync_docs:
        - docs/context/files/README.md
    - name: product-code
      paths:
        - src/**
      role: runtime_code
      sync_docs:
        - docs/context/files/README.md
        - docs/context/functions/README.md
        - docs/api/API.md
        - docs/context/apis/README.md
        - docs/context/models/README.md
  file_classes:
    - name: api_files
      paths:
        - src/api/**
        - src/routes/**
        - src/controllers/**
        - src/endpoints/**
      sync_docs:
        - docs/api/API.md
        - docs/context/apis/README.md
    - name: function_files
      paths:
        - src/services/**
        - src/controllers/**
        - src/utils/**
      sync_docs:
        - docs/context/functions/README.md
    - name: model_files
      paths:
        - src/models/**
        - schema/**
        - config/**
      sync_docs:
        - docs/context/models/README.md
    - name: structure_files
      paths:
        - .claude/**
        - tools/**
      sync_docs:
        - docs/context/structure/README.md
