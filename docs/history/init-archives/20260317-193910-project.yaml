project:
  name: "ClaudeDevKit"
  type: "governance-workbench"
  description: "Single-project AI development governance workspace"
  primary_language: "markdown"
  stack:
    - markdown
    - yaml
    - shell

modules:
  governance-core:
    path:
      - .claude/**
      - tools/**
    status: active
    level: core
  planning-state:
    path:
      - docs/goals/**
      - docs/roadmap/**
      - docs/history/**
    status: active
    level: stable
  context-docs:
    path:
      - docs/context/**
      - docs/api/**
      - README.md
    status: active
    level: active
  product-code:
    path:
      - src/**
    status: todo
    level: active

fact_sources:
  highest:
    - .claude/project.yaml
    - docs/goals/CURRENT_GOAL.yaml
    - docs/goals/CURRENT_TASKS.yaml
    - docs/goals/INBOX.yaml
  medium:
    - docs/roadmap/ROADMAP.md
    - docs/context/FACT_SOURCES.md
    - docs/context/structure/STRUCTURE_CONTRACT.yaml
    - docs/context/structure/SYNC_RULES.yaml
    - docs/api/API.md
  derived:
    - docs/reports/*.md
    - docs/history/COMMIT_HISTORY.md

required_cleanup:
  - remove_or_mark_replaced_plans
  - update_current_goal_when_scope_changes
  - update_current_tasks_when_scope_changes
  - keep_inbox_only_for_open_items
  - flag_dead_code_or_dead_docs_in_review
