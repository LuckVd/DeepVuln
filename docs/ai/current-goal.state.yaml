open_issues:
  - id: "P1"
    issue: "Semgrep --config auto 产 0 findings"
    impact: "引擎级检出为空"
    next: "排查 registry 拉取/规则包匹配"
    status: "resolved 2026-08-26"
    resolution: "HOME 不可写致 semgrep 启动崩溃 → _spawn_env 注入 SEMGREP_LOG_FILE；相对 source_path 双解析 → resolve；HOME=/root 下 mini 三语言全检出"
  - id: "P2"
    issue: "CPG 可达性全标 not_exploitable (reachability=0.10)"
    impact: "exploitability 判定质量低；Flask/Spring/net-http 入口未被 CPG 识别"
    next: "修 CPG 入口识别——Phase 18 已知问题，mini 基准首次量化了影响"
    status: "resolved 2026-08-28"
    resolution: "①入口层：4处 _get_text 字节/字符错位→node.text + java_detector 补 Servlet；②sink 层：finder 白名单补 method_invocation/object_creation_expression，get_attack_paths(None) 用语言专属 pattern（java exec/Runtime；go 补 http.*/db.QueryRow SSRF+SQL）。三语言攻击路径全通（doGet→exec、ping_host→system、cmdi/ssrf/sqli handler→sink）"
  - id: "P3"
    issue: "safe 文件 FP 多（agent 低置信度 suspicious 条目）"
    impact: "Precision 低 (0.235→0.421 at conf>=0.5)"
    next: "按 is_suspicious 标签过滤或提阈值"
    status: "resolved 2026-08-26"
    resolution: "adjudication 前抽离 is_suspicious 条目至审查队列（_split_review_queue + ScanConfig.include_suspicious_findings 逃生阀）；run1 DB 模拟 P 0.160→0.333 / F1 0.271→0.485，零 TP 损失"
  - id: "P4"
    issue: "java-cmdi FN（agent 未识别 Runtime.exec 为 cmd_injection）"
    impact: "Recall 缺口"
    next: "补 prompt 规则或加 dangerous API 检测"
    status: "resolved 2026-08-27"
    resolution: "双根因：①run1 该文件 agent 调用遇 provider 503（上游瞬时故障）；②ox-alpha-free 模型名下线（401）→ 迁移 deepseek-v4-flash 后 agent 检出 command_injection conf=1.0；semgrep 另出 tainted-cmd-from-http-request"

