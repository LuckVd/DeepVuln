requirements:
  - Every implementation task must have a change intent.
  - Change intent must declare planned files or planned modules.
  - Any diff outside declared scope must be reported as scope drift.
  - Scope changes require CURRENT_GOAL or INBOX synchronization.
  - When scope changes invalidate previous work, cleanup is required.

change_intent_template:
  goal: ""
  intent: ""
  planned_files: []
  do_not_touch: []
  risk_flags: []
  verification_plan: []
