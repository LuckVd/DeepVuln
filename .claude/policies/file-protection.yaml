levels:
  active:
    edit: allowed
    note: Free modification
  stable:
    edit: require-proposal
    note: Explain impact before modification
  core:
    edit: require-user-confirmation
    note: Stop and ask before editing

rules:
  - match: .claude/**
    level: core
  - match: tools/**
    level: core
  - match: docs/goals/**
    level: stable
  - match: docs/roadmap/**
    level: stable
  - match: docs/history/**
    level: stable
  - match: src/**
    level: active
